[project]
name = "backend"
version = "0.3.0"
description = "Sentinel Unified AI Operations Backend (PostgreSQL + Async SQLAlchemy 2.0)"
readme = "README.md"
authors = [
    { name = "emmanuel-nwafor", email = "emitexc.e.o1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arq>=0.28.0",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "boto3>=1.34.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=5.3.1",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
