<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject | default("Dispatch Notification") }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #f8fafc;
      padding: 40px 16px;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    .header {
      padding: 32px 32px 24px 32px;
      border-bottom: 1px solid #f1f5f9;
      background: #09090b;
      text-align: left;
    }
    .brand {
      display: inline-block;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-decoration: none;
    }
    .brand-dot {
      color: #3b82f6;
    }
    .brand-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 9999px;
      background-color: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }
    .content {
      padding: 32px;
    }
    .footer {
      padding: 24px 32px;
      background-color: #f8fafc;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      text-align: center;
    }
    .footer a {
      color: #3b82f6;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <a href="https://dispatch.io" class="brand">
          Dispatch<span class="brand-dot">.</span>io
        </a>
        <span class="brand-badge">Platform</span>
      </div>

      <div class="content">
        {% block content %}{% endblock %}
      </div>

      <div class="footer">
        <p style="margin: 0 0 8px 0;">
          Sent with care by <strong>Dispatch Operations</strong> &bull; dispatch.io
        </p>
        <p style="margin: 0;">
          Questions? Reply directly to this email or visit our <a href="https://dispatch.io/support">Help Center</a>.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
